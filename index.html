<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар Баасын Сканерлоо</title>
    <!-- ZXing сканер китепканасы -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <style>
        /* --- СТИЛДЕР (CSS) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 20px;
        }

        #reader {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            display: none; /* Башында жашыруун турат */
        }

        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #c0392b;
        }

        button:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 10px;
            border: 1px dashed #ccc;
            display: none;
            text-align: left;
        }

        .result-box img {
            max-width: 100px;
            border-radius: 5px;
            margin-top: 10px;
        }

        .product-title {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .price {
            font-size: 24px;
            color: #e74c3c;
            font-weight: bold;
            margin-top: 10px;
        }

        .error {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📷 Баасын Сканерлоо</h1>
        
        <!-- Сканер экраны -->
        <div id="reader"></div>
        
        <!-- Баштоо баскычы -->
        <button id="scan-btn">Сканерди Баштоо</button>
        
        <!-- Натыйжа чыга турган жер -->
        <div id="result" class="result-box">
            <p>Натыйжа күтүлүүдө...</p>
        </div>
    </div>

    <script>
        // --- ЛОГИКА (JAVASCRIPT) ---
        
        const codeReader = new ZXing.BrowserMultiFormatReader();
        const scanBtn = document.getElementById('scan-btn');
        const readerDiv = document.getElementById('reader');
        const resultDiv = document.getElementById('result');

        let isScanning = false;

        scanBtn.addEventListener('click', () => {
            if (isScanning) {
                // Эгер сканер иштеп жатса, токтотуу
                codeReader.reset();
                isScanning = false;
                readerDiv.style.display = 'none';
                scanBtn.textContent = 'Сканерди Баштоо';
                return;
            }

            // Сканерди баштоо
            isScanning = true;
            scanBtn.textContent = 'Токтотуу';
            readerDiv.style.display = 'block';
            resultDiv.style.display = 'none'; // Мурунку натыйжаны жашыруу

            codeReader.decodeFromVideoDevice(null, 'reader', (result, err) => {
                if (result) {
                    console.log("Сканерленди: ", result.text);
                    
                    // Сканерди токтотуу
                    codeReader.reset();
                    isScanning = false;
                    readerDiv.style.display = 'none';
                    scanBtn.textContent = 'Кайра Сканерлоо';
                    
                    // Товарды изделөө
                    fetchProductInfo(result.text);
                }
                if (err) {
                    // Камера ачылганга чейинки каталарды эсепке албайбыз
                    if (err.name !== 'NotFoundException') {
                        console.error(err);
                    }
                }
            });
        });

        // Товар маалыматын интернеттен алуу функциясы
        async function fetchProductInfo(barcode) {
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<p>Изделүүдө: ${barcode}...</p>`;

            try {
                // Open Food Facts базасынан маалымат алуу
                const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                const data = await response.json();

                if (data.status === 1) {
                    const product = data.product;
                    const productName = product.product_name || 'Аты белгисиз товар';
                    const brand = product.brands || 'Бренд жок';
                    const imageUrl = product.image_url || '';

                    // ⚠️ БАА КОШУУ ЖЕРИ:
                    // Азыр баа API'ден келбейт. Сиз өзүңүздүн базаңызды (мисалы, Firebase) 
                    // туташтырып, ушул жерге бааны чыгарсаңыз болот.
                    // Азырынча "Баа белгисиз" деп турат.
                    const price = "Баа белгисиз"; 

                    resultDiv.innerHTML = `
                        <h3 class="product-title">${productName}</h3>
                        <p><strong>Бренд:</strong> ${brand}</p>
                        <p><strong>Штрих-код:</strong> ${barcode}</p>
                        <div class="price">${price}</div>
                        ${imageUrl ? `<img src="${imageUrl}" alt="Сүрөтү">` : ''}
                    `;
                } else {
                    // Товар табылбаса
                    resultDiv.innerHTML = `
                        <p class="error">Бул штрих-код боюнча маалымат табылган жок.</p>
                        <p>Код: ${barcode}</p>
                        <p>Сиз бул товарды өз базаңызга кошо аласыз.</p>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">Интернетке туташуу катасы: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
