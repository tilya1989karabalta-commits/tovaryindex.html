<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар Баасын Сканерлоо</title>
    
    <!-- ZXing сканер китепканасы -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <style>
        /* --- СТИЛДЕР (CSS) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 20px;
        }

        /* Сканердин экраны үчүн стиль */
        #reader {
            width: 100%;
            height: 300px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            display: none;
            position: relative;
            background-color: #000;
        }

        /* Видео элементтерин туура жайгаштыруу */
        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        button#scan-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        button#scan-btn:hover {
            background-color: #c0392b;
        }

        button#scan-btn:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 10px;
            border: 1px dashed #ccc;
            display: none;
            text-align: left;
        }

        .result-box img {
            max-width: 100px;
            border-radius: 5px;
            margin-top: 10px;
        }

        .product-title {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .price {
            font-size: 24px;
            color: #e74c3c;
            font-weight: bold;
            margin-top: 10px;
        }

        .error {
            color: #e74c3c;
            font-weight: bold;
        }

        /* --- БАЙЛАНЫШ БӨЛҮГҮ ҮЧҮН ЖАҢЫ СТИЛДЕР --- */
        .contact-info {
            background: #2c3e50; /* Кочкул көк түс */
            color: white;
            padding: 15px;
            border-radius: 15px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .contact-info p {
            margin-bottom: 10px;
            font-size: 14px;
            color: #bdc3c7;
        }

        .phone-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .phone-links a {
            color: #ecf0f1;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .phone-links a:hover {
            background: #e74c3c; /* Үстүнө басканда кызыл болот */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📷 Баасын Сканерлоо</h1>
        
        <!-- Сканер экраны чыга турган жер -->
        <div id="reader"></div>
        
        <!-- Баштоо баскычы -->
        <button id="scan-btn">Сканерди Баштоо</button>
        
        <!-- Натыйжа чыга турган жер -->
        <div id="result" class="result-box">
            <p>Натыйжа күтүлүүдө...</p>
        </div>
    </div>

    <!-- БАЙЛАНЫШ БӨЛҮГҮ (Жаңы кошулду) -->
    <div class="contact-info">
        <p>Суроолор боюнча байланышыңыз:</p>
        <div class="phone-links">
            <!-- tel: шилтемеси телефон чалуу тиркемесин ачат -->
            <a href="tel:0556652652">📞 0556-652-652</a>
            <a href="tel:0559656657">📞 0559-656-657</a>
        </div>
    </div>

    <script>
        // --- ЛОГИКА (JAVASCRIPT) ---
        
        const codeReader = new ZXing.BrowserMultiFormatReader();
        const scanBtn = document.getElementById('scan-btn');
        const readerDiv = document.getElementById('reader');
        const resultDiv = document.getElementById('result');

        let isScanning = false;
        let currentStream = null;

        scanBtn.addEventListener('click', async () => {
            if (isScanning) {
                stopScanner();
                return;
            }

            isScanning = true;
            scanBtn.textContent = 'Токтотуу';
            readerDiv.style.display = 'block';
            resultDiv.style.display = 'none'; 

            try {
                const constraints = {
                    video: {
                        facingMode: "environment" 
                    }
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                codeReader.decodeFromStream(currentStream, 'reader', (result, err) => {
                    if (result) {
                        console.log("Сканерленди: ", result.text);
                        stopScanner();
                        fetchProductInfo(result.text);
                    }
                    if (err) {
                        if (!(err instanceof ZXing.NotFoundException)) {
                            console.error(err);
                        }
                    }
                });

            } catch (error) {
                console.error("Камераны ачуу катасы:", error);
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<p class="error">Камерага уруксат берилген жок же камера иштебей жатат. Сураныч, браузердин уруксаттарын текшерип, баракчаны жаңыртыңыз.</p>`;
                stopScanner();
            }
        });

        function stopScanner() {
            isScanning = false;
            scanBtn.textContent = 'Кайра Сканерлоо';
            readerDiv.style.display = 'none';
            
            codeReader.reset();
            
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        async function fetchProductInfo(barcode) {
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<p>Изделүүдө: ${barcode}...</p>`;

            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                const data = await response.json();

                if (data.status === 1) {
                    const product = data.product;
                    const productName = product.product_name || 'Аты белгисиз товар';
                    const brand = product.brands || 'Бренд жок';
                    const imageUrl = product.image_url || '';

                    const price = "Баа белгисиз"; 

                    resultDiv.innerHTML = `
                        <h3 class="product-title">${productName}</h3>
                        <p><strong>Бренд:</strong> ${brand}</p>
                        <p><strong>Штрих-код:</strong> ${barcode}</p>
                        <div class="price">${price}</div>
                        ${imageUrl ? `<img src="${imageUrl}" alt="Сүрөтү">` : ''}
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <p class="error">Бул штрих-код боюнча маалымат табылган жок.</p>
                        <p>Код: ${barcode}</p>
                        <p>Сиз бул товарды өз базаңызга кошо аласыз.</p>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">Интернетке туташуу катасы: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
